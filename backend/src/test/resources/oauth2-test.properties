# 컨텍스트를 띄우기 위한 Provider 설정. 값 자체는 쓰이지 않는다 — IdP 왕복은 자동화하지 않는다.
# 파일 이름을 application.properties/yml 로 두면 main 의 application.yml 을 가려버리므로 쓰지 않는다.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# SSAFY 는 엔드포인트를 application.yml 에 직접 적으므로 discovery 요청이 나가지 않는다.
spring.security.oauth2.client.registration.ssafy.client-id=test-client-id
spring.security.oauth2.client.registration.ssafy.client-secret=test-client-secret

# PostgreSQL 과 Redis 를 동시에 띄운다. 컨테이너는 Spring 빈이라 컨텍스트마다 한 쌍이
# 새로 뜨는데(현재 21회), 순차 기동이면 둘의 시간이 그대로 더해진다.
spring.testcontainers.beans.startup=parallel
