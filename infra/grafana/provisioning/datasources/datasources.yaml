# ═══════════════════════════════════════════════════════════════════════════════
# Grafana 데이터소스 provisioning — 기동 시 이 파일을 읽어 데이터소스를 자동 등록한다.
# (compose 가 infra/grafana/provisioning 을 /etc/grafana/provisioning 에 마운트한다.)
# ═══════════════════════════════════════════════════════════════════════════════
#
# UI 에서 손으로 만들면 grafana-data 볼륨을 지우는 순간 사라진다. 파일로 두면 코드로 남는다.
# 이렇게 등록된 데이터소스는 UI 에서 수정할 수 없다 (파일이 진실).
#
# uid 를 고정하는 이유: 데이터소스끼리 서로를 uid 로 가리킨다 (아래 datasourceUid).
# 대시보드 JSON 도 uid 로 데이터소스를 찾는다 (5단계).
#
# `$$` 는 이스케이프다. Grafana 는 provisioning 파일의 `$VAR` 를 환경변수로 치환하므로,
# Grafana 템플릿 변수 `${__value.raw}` 를 그대로 남기려면 `$${...}` 로 쓴다.
#
# access: proxy — 브라우저가 아니라 Grafana 서버가 대신 요청한다. 그래서 loki·tempo 는
# 호스트에 포트를 열 필요가 없다 (도커 네트워크 안의 grafana 만 닿으면 된다).
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # ── 로그 → 트레이스 ──
      # 로그 줄마다 "Tempo 에서 보기" 버튼을 만든다. 값을 어디서 꺼낼지:
      #   matcherType: label  → 라벨·structured metadata 이름으로 찾는다 (본문 정규식이 아니라)
      #   matcherRegex: trace_id → 그 이름. Alloy 가 structured metadata 로 붙인 trace_id
      #   url: ${__value.raw} → 꺼낸 값 그대로를 Tempo(datasourceUid) 쿼리로 쓴다 = trace ID 조회
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Tempo 에서 보기

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # ── 트레이스 → 로그 ──
      # span 마다 "Logs for this span" 버튼을 만든다. 누르면 아래 LogQL 을 Loki 에 던진다.
      #   ${__trace.traceId} → 지금 보는 트레이스의 ID
      #   `| trace_id="…"`   → structured metadata 필터
      # 서비스로 거르지 않는다 — 한 트레이스의 backend·ai 로그가 함께 나온다.
      # spanStart/EndTimeShift: span 시간 앞뒤 1분까지 찾는다 (로그 시각과 span 시각의 오차 흡수).
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{env="local"} | trace_id="$${__trace.traceId}"'
      # 트레이스 화면에 span 관계를 그래프로도 보여 준다.
      nodeGraph:
        enabled: true

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      # Alloy 의 scrape_interval 과 맞춘다. 패널의 $__rate_interval 계산이 이 값을 쓴다.
      timeInterval: 15s
