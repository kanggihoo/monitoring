# uid 를 고정한다 — 데이터소스 간 링크(로그↔트레이스)와 대시보드 JSON 이 이 값으로 잇는다.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # 로그 → 트레이스. trace_id 는 라벨이 아니라 structured metadata 라 matcherType: label 로 읽는다.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Tempo 에서 보기

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # 트레이스 → 로그. 서비스로 거르지 않는다 — 한 트레이스의 backend·ai 로그가 함께 나온다.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{env="local"} | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
