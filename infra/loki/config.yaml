# 단일 바이너리(-target=all) + 로컬 파일시스템. 로컬 학습용 최소 구성.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7일
  # trace_id·span_id 를 라벨이 아니라 structured metadata 로 받는다.
  allow_structured_metadata: true
  # Loki 가 자동으로 붙이는 service_name 라벨을 끈다. Alloy 가 service 를 이미 준다.
  discover_service_name: []

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
