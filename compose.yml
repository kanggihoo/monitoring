# ═══════════════════════════════════════════════════════════════════════════════
# 로컬 관측성 학습용 전체 스택.  읽는 순서 안내: infra/README.md
# ═══════════════════════════════════════════════════════════════════════════════
#
#   docker compose up -d                                   # postgres·redis 만
#   docker compose --profile app up -d --build             # + backend·ai
#   docker compose --profile app --profile monitoring up -d --build   # + 관측 스택
#
# profile 은 "이 서비스는 해당 --profile 을 줄 때만 뜬다"는 표시다. profile 이 없는
# 서비스(postgres·redis)는 항상 뜬다. 세 층으로 나눠서 필요한 만큼만 띄운다.
#
# ── 신호가 흐르는 길 (컨테이너 이름 기준) ──────────────────────────────────────────
#
#   로그     backend·ai ─stdout(JSON)→ Docker(json-file) ←읽기─ socket-proxy ←─ alloy ─push→ loki
#   트레이스 backend·ai ─OTLP http :4318→ alloy (tail sampling) ─OTLP grpc :4317→ tempo
#   메트릭   alloy ─scrape→ backend·ai·exporter 의 /metrics ─remote write→ prometheus
#   보기     grafana ─query→ loki · tempo · prometheus
#
# 앱은 관측 백엔드(loki·tempo·prometheus)의 주소를 모른다. 앱이 아는 것은 alloy 하나뿐이고,
# 어디로 보낼지·무엇을 버릴지는 alloy 설정(infra/alloy/config.alloy)이 정한다.
#
# ── 네트워크 ────────────────────────────────────────────────────────────────────
# compose 가 프로젝트마다 기본 네트워크(a605_default)를 하나 만들고 모든 서비스를 넣는다.
# 그 안에서는 서비스 이름이 곧 호스트 이름이다 (http://loki:3100, tempo:4317 …).
# `ports:` 는 **호스트(내 맥)에서** 들어가기 위한 것이라, 컨테이너끼리 통신에는 필요 없다.
# 그래서 브라우저·로컬 도구로 들어갈 것만 열고, 전부 127.0.0.1 에 묶어 같은 와이파이의
# 다른 기기에서는 닿지 않게 한다.
#
# frontend 는 여기 없다. production 빌드는 /api 를 nginx 에 맡기므로 단독 컨테이너로는
# backend 에 닿지 않는다. 호스트에서 `cd frontend && pnpm dev` 로 띄우면 rewrite 가
# 127.0.0.1:8080 으로 잇는다. 계측·로그 수집 대상도 아니다.
#
# backend/compose.yml 과 포트(5432)가 겹친다. 둘을 동시에 띄우지 않는다.
name: a605

# `x-` 로 시작하는 최상위 키는 compose 가 무시한다 — YAML 앵커(&logging)를 걸어 두고
# 서비스마다 `logging: *logging` 으로 재사용하기 위한 자리다.
#
# json-file 은 Docker 기본 로그 드라이버로, 컨테이너 stdout 을 호스트 파일에 쌓는다.
# alloy 는 이 파일을 Docker API(/containers/{id}/logs)로 읽어 간다. 회전(max-size·max-file)을
# 걸지 않으면 로그 파일이 끝없이 커진다.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 기본 (profile 없음)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.11-alpine
    logging: *logging
    environment:
      POSTGRES_DB: ssafydb
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ssafy
    ports:
      # backend/scripts/load-replay.sh local 이 localhost:5432 로 적재한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # backend 의 depends_on 이 이 상태(healthy)를 기다린다. 없으면 Flyway 가 DB 기동 전에 붙는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafy -d ssafydb"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.11-alpine
    logging: *logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─────────────────────────────────────────────────────────────────────────────
  # app — 관측 대상
  # ─────────────────────────────────────────────────────────────────────────────

  # 일회용 init 컨테이너. OTel Java agent jar 를 공유 볼륨(otel-agent)에 복사하고 종료한다.
  # backend 가 그 볼륨을 읽기 전용으로 마운트해 -javaagent 로 붙인다.
  # → backend 이미지·Dockerfile 을 건드리지 않고 계측을 붙이는 방법이다 (k8s OTel Operator 와 같은 방식).
  otel-agent:
    profiles: ["app"]
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.31.1
    command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
    volumes:
      - otel-agent:/otel

  backend:
    profiles: ["app"]
    build: ./backend
    logging: *logging
    # 수집 선언 (CONTEXT.md) — alloy 는 라벨로 대상을 고른다. 수집 대상 목록이 alloy 설정에 없다.
    #   logging.collect  이 컨테이너의 stdout 을 Loki 로
    #   metrics.*        이 포트·경로를 15초마다 긁어 Prometheus 로
    labels:
      logging.collect: "true"
      metrics.scrape: "true"
      metrics.port: "8080"
      metrics.path: /actuator/prometheus # Micrometer. JVM·Hikari·HTTP 서버·executor 지표
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      otel-agent:
        condition: service_completed_successfully # jar 복사가 끝난 뒤에 뜬다
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # OAuth 비밀값 등은 기존 backend/.env 를 그대로 읽는다. 아래 environment 가 이긴다.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 컨테이너 네트워크 기준 주소 — localhost 가 아니라 서비스 이름이다.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ssafydb
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ssafy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_BASE_URL: http://ai:8000
      # 비어 있으면 기동하지 않는 OAuth 등록값. 로컬에서는 test-support 로그인을 쓰므로 자리만 채운다.
      SSAFY_CLIENT_ID: ${SSAFY_CLIENT_ID:-local-unused}
      SSAFY_CLIENT_SECRET: ${SSAFY_CLIENT_SECRET:-local-unused}

      # ── 로그 ──
      # Spring Boot 내장 구조화 로그. 콘솔을 한 줄 JSON 으로 낸다. 필드: @timestamp·level·
      # logger_name·thread_name·message + MDC 값 전부(trace_id·span_id 가 여기로 온다).
      # ai 의 JsonFormatter 가 같은 필드 이름을 써서 alloy 가 한 규칙으로 읽는다.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

      # ── 트레이스 (OTel Java agent) ──
      # JVM 이 뜰 때 agent 를 붙인다. agent 는 바이트코드를 고쳐 Tomcat·JPA·JDBC·Lettuce·
      # @Scheduled·executor 를 자동 계측하고, 현재 trace_id·span_id 를 logback MDC 에 넣는다.
      JAVA_TOOL_OPTIONS: -javaagent:/otel/javaagent.jar
      OTEL_SERVICE_NAME: backend # span 의 resource 속성 service.name. Tempo 에서 서비스 이름이 된다
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local # 로그·메트릭의 env=local 에 해당
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318 # 목적지는 Tempo 가 아니라 alloy
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # agent 는 메트릭·로그도 낼 수 있지만 끈다. 메트릭은 기존 Micrometer(/actuator/prometheus)가,
      # 로그는 stdout → alloy 가 맡는다. 같은 신호를 두 길로 보내지 않는다.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Spring Boot 가 Lettuce(Redis 클라이언트)의 tracing 자리를 Micrometer Observation 으로
      # 덮어써서 agent 가 넣은 OTel tracing 이 사라진다 → Redis span 이 하나도 안 나온다.
      # 이 자동설정을 빼면 Redis span 이 살아나는 대신 lettuce_* Micrometer 메트릭이 없어진다
      # (ADR 0001 Consequences). Redis 메트릭은 redis_exporter 가 서버 관점에서 낸다.
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
    ports:
      - "127.0.0.1:8080:8080"

  ai:
    profiles: ["app"]
    build: ./ai
    logging: *logging
    labels:
      logging.collect: "true"
      metrics.scrape: "true"
      metrics.port: "8000" # /metrics (prometheus-fastapi-instrumentator)
    env_file:
      - path: ./ai/.env
        required: false
    environment:
      AI_ENV: local
      # ai/app/core/logging.py 의 JsonFormatter 를 켠다. 개발(uv run)은 기본 text 그대로다.
      AI_LOG_FORMAT: json

      # ── 트레이스 (opentelemetry-instrument) ──
      # 설정 이름이 Java agent 와 같다 — OTEL_* 환경변수는 언어와 무관한 OTel 표준이다.
      OTEL_SERVICE_NAME: ai
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # 로그 레코드에 otelTraceID·otelSpanID 를 붙인다 → JsonFormatter 가 trace_id·span_id 로 싣는다.
      OTEL_PYTHON_LOG_CORRELATION: "true"
      # 이 정규식에 걸리는 URL 은 span 을 만들지 않는다. 컨테이너 HEALTHCHECK 가 30초마다 부른다.
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: health
    # 이미지 CMD(uvicorn …) 앞에 opentelemetry-instrument 만 붙였다. 이 래퍼가 파이썬이 뜰 때
    # 설치된 계측 패키지(fastapi·logging)를 찾아 자동으로 켠다 — 앱 코드에 SDK 초기화가 없다.
    command: ["opentelemetry-instrument", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  # ─────────────────────────────────────────────────────────────────────────────
  # monitoring — 관측 스택
  # ─────────────────────────────────────────────────────────────────────────────

  # docker.sock 은 Docker 데몬의 전체 권한이다 (컨테이너 생성·삭제·exec 까지). 수집기에 통째로
  # 주지 않고, 이 프록시가 허용한 API 만 통과시킨다. alloy 는 tcp://socket-proxy:2375 로 붙는다.
  #   CONTAINERS=1 → GET /containers/json(목록), /containers/{id}/logs(로그 읽기)
  #   NETWORKS=1   → discovery.docker 가 네트워크 라벨을 계산할 때 조회한다
  #   INFO=1       → GET /info. cadvisor 가 Docker 데몬 정보를 읽는다
  #   POST=0       → 쓰기(생성·시작·삭제) 전부 거부
  socket-proxy:
    profiles: ["monitoring"]
    image: tecnativa/docker-socket-proxy:v0.5.0
    logging: *logging
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # 수집기. 로그·트레이스(·메트릭)를 받아 가공하고 백엔드로 보낸다. 설정: infra/alloy/config.alloy
  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.19.2
    logging: *logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345 # UI(파이프라인 그래프)·자체 메트릭(/metrics)
      # 로그를 어디까지 읽었는지(positions)·WAL 을 재기동 너머로 보존한다. 없으면 재기동마다
      # 컨테이너 로그를 처음부터 다시 읽어 Loki 에 중복으로 넣는다.
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [socket-proxy, loki, tempo, prometheus]
    # 4318(OTLP 수신)은 열지 않는다 — 보내는 쪽(backend·ai)이 같은 네트워크 안에 있다.
    ports:
      - "127.0.0.1:12345:12345"

  # 로그 저장소. 설정: infra/loki/config.yaml. 포트를 열지 않는다 — 조회는 grafana 를 거친다.
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.7.8
    logging: *logging
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  # 트레이스 저장소. 설정: infra/tempo/config.yaml
  tempo:
    profiles: ["monitoring"]
    image: grafana/tempo:2.9.5
    logging: *logging
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  # 메트릭 저장소. 설정: infra/prometheus/prometheus.yml — 스스로 긁지 않고 받기만 한다.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.14.0
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # POST /api/v1/write 를 연다. Alloy(와 6단계의 k6)가 여기로 밀어 넣는다.
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Prometheus 자체 UI(쿼리·Status→TSDB). 평소 조회는 grafana 로 한다.
      - "127.0.0.1:9090:9090"

  # ── exporter: 스스로 /metrics 를 내지 않는 것들을 대신해 지표를 만들어 주는 번역기 ──
  # 모두 수집 선언(metrics.* 라벨)으로 alloy 에 잡힌다. 로그는 수집하지 않는다.

  # Postgres 에 SQL 로 접속해 pg_stat_* 뷰를 읽고 지표로 바꾼다 (연결 수·트랜잭션·락·캐시 적중률…).
  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    logging: *logging
    labels:
      metrics.scrape: "true"
      metrics.port: "9187"
    environment:
      DATA_SOURCE_URI: postgres:5432/ssafydb?sslmode=disable
      DATA_SOURCE_USER: ssafy
      DATA_SOURCE_PASS: ssafy
    depends_on:
      postgres:
        condition: service_healthy

  # Redis 에 INFO 명령을 보내 지표로 바꾼다 (메모리·명령 수·키 수·연결 수…).
  # backend 의 Lettuce 클라이언트 지표를 끈 대신(ADR 0001) 서버 관점은 여기서 본다.
  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.92.0
    logging: *logging
    labels:
      metrics.scrape: "true"
      metrics.port: "9121"
    environment:
      REDIS_ADDR: redis://redis:6379

  # 호스트(머신) 지표 — CPU·메모리·디스크·네트워크. /proc·/sys 를 읽는다.
  # macOS 에서는 컨테이너가 OrbStack 의 리눅스 VM 안에서 돈다 → 보이는 것은 맥이 아니라 그 VM 이다.
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.12.1
    logging: *logging
    labels:
      metrics.scrape: "true"
      metrics.port: "9100"
    command: ["--path.rootfs=/host"]
    pid: host # 호스트의 프로세스 네임스페이스를 본다 (프로세스 수 등)
    volumes:
      - /:/host:ro,rslave

  # 컨테이너별 지표 — CPU·메모리·네트워크·디스크 I/O 를 컨테이너 단위로 (cgroup 을 읽는다).
  # 컨테이너 이름·라벨은 Docker API 로 알아내는데, docker.sock 대신 socket-proxy 로 묻는다.
  #
  # ⚠️ socket-proxy 원칙의 유일한 예외: containerd 소켓을 직접 마운트한다.
  # 최신 cadvisor 는 컨테이너 cgroup 을 containerd 에 물어 찾는다. 소켓이 없으면 호스트 합계(id="/")
  # 하나만 나오고 컨테이너별 지표가 전혀 없다. containerd 소켓은 docker.sock 과 같은 전체 권한이다
  # (`:ro` 는 소켓 API 를 막지 못한다). 우리가 짜는 수집 파이프라인(alloy)이 아니라 검증된 exporter
  # 하나에만, 외부 포트 없이 준다. 경로는 OrbStack 기준이다 (Docker Desktop 은 /run/containerd/…).
  #
  # 호스트의 **모든** 컨테이너가 보인다. 이 프로젝트(a605) 것만 남기는 필터는 alloy 메트릭 ③ 에 있다.
  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:v0.60.6
    logging: *logging
    labels:
      metrics.scrape: "true"
      metrics.port: "8080"
    command:
      - --docker=tcp://socket-proxy:2375
      - --docker_only=true # 도커 컨테이너만 (시스템 cgroup 제외)
      - --housekeeping_interval=15s # 수집 주기와 맞춘다
      - --store_container_labels=false # 컨테이너 라벨 전부를 지표 라벨로 올리지 않는다 (카디널리티)
      # 이 둘만 지표 라벨로 올린다 → 서비스 이름으로 보고, 프로젝트 이름으로 다른 프로젝트를 걸러낸다.
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    privileged: true # cgroup·/dev/kmsg 접근
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    depends_on: [socket-proxy]

  # 화면. 저장소가 아니라 조회기다 — 데이터는 loki·tempo·prometheus 에 있고, grafana 는 그때그때 묻는다.
  # provisioning/ 아래 파일을 기동 시 읽어 데이터소스(·대시보드)를 자동 등록한다 → UI 에서 손으로 만들지 않는다.
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.2
    logging: *logging
    environment:
      # 로컬 학습용 — 로그인 없이 Admin. 포트가 127.0.0.1 에만 열려 있어서 허용한다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3000 은 호스트의 frontend(pnpm dev)가 쓴다.
      - "127.0.0.1:3001:3000"

# named volume — `docker compose down` 해도 남는다. 지우려면 `down -v`.
# 설정 파일은 bind mount(./infra/...)라 내용을 고쳐도 compose 는 변경으로 보지 않는다.
# → 설정을 고친 뒤에는 `docker compose restart <서비스>` 로 다시 읽힌다.
volumes:
  postgres-data:
  redis-data:
  otel-agent:
  alloy-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
